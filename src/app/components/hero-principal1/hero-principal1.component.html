<section class="hero" id="hero">
  <div class="glow-blob hero-glow-1"></div>
  <div class="glow-blob hero-glow-2"></div>
  <app-particle-field class="hero-particles"></app-particle-field>
  <div class="noise-overlay"></div>

  <div class="container hero-inner">

    <div class="hero-copy">
      <div class="hero-badge">
        <span class="pulse-dot"></span>
        ✦ Desarrollo web a medida
      </div>

      <div class="line">
        <h1 class="line-inner" #headline>
          Transformamos tu idea en una <span class="accent">experiencia digital</span> que convierte.
        </h1>
      </div>

      <p class="hero-desc" #desc>
        Somos <strong>Zencode</strong> — un equipo que diseña y desarrolla sitios web
        únicos, rápidos y pensados para hacer crecer tu negocio.
      </p>

      <div class="hero-actions" #actions>
        <a href="#contacto" class="btn-primary magnetic" #magneticBtn>Empezá tu proyecto &rarr;</a>
        <a href="#proyectos" class="btn-outline">Ver nuestro trabajo</a>
      </div>

      <div class="hero-stats" #stats>
        <div class="stat">
          <span class="stat-num">100%</span>
          <span class="stat-label">Personalizado</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-num">+5</span>
          <span class="stat-label">Tecnologías</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-num">24h</span>
          <span class="stat-label">Respuesta</span>
        </div>
      </div>
    </div>

    <div class="hero-visual" #visual>
      <div class="orbit-ring orbit-ring-1"></div>
      <div class="orbit-ring orbit-ring-2"></div>
      <div class="logo-glow"></div>
      <img src="logo-zencode.png" alt="Zencode" class="hero-logo" />
      <span class="orbit-dot dot-a"></span>
      <span class="orbit-dot dot-b"></span>
    </div>

  </div>

  <svg class="hero-flow" viewBox="0 0 1440 160" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="flowGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7719E3" stop-opacity="0" />
        <stop offset="30%" stop-color="#7719E3" stop-opacity="0.8" />
        <stop offset="60%" stop-color="#B61FBA" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#EE2E93" stop-opacity="0" />
      </linearGradient>
    </defs>
    <path
      class="flow-path"
      d="M-100,110 C 250,40 450,150 750,80 S 1250,20 1550,90"
      fill="none"
      stroke="url(#flowGradient)"
      stroke-width="2"
    />
  </svg>

  <div class="scroll-cue">
    <span></span>
  </div>
</section>
