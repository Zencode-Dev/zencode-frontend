<section id="proceso">
  <div class="container">
    <h2 class="section-title" appReveal>Así <span>trabajamos</span></h2>
    <p class="section-subtitle" appReveal>
      Un proceso claro, transparente y colaborativo — para que sepas exactamente qué pasa en cada etapa de tu proyecto.
    </p>

    <div class="timeline" #timeline>
      <div class="timeline-track">
        <div class="timeline-progress" #progress></div>
      </div>

      <div class="timeline-item" *ngFor="let s of steps; let i = index" #item>
        <div class="side left">
          <div class="timeline-card neon-card" *ngIf="i % 2 === 0">
            <span class="timeline-num">{{ s.num }}</span>
            <h3>{{ s.title }}</h3>
            <p class="timeline-desc">{{ s.desc }}</p>
            <ul class="timeline-details">
              <li *ngFor="let d of s.details"><span class="check">&#10003;</span>{{ d }}</li>
            </ul>
          </div>
        </div>

        <div class="node-col">
          <div class="timeline-node" #node><span class="node-icon">{{ s.icon }}</span></div>
        </div>

        <div class="side right">
          <div class="timeline-card neon-card" *ngIf="i % 2 === 1">
            <span class="timeline-num">{{ s.num }}</span>
            <h3>{{ s.title }}</h3>
            <p class="timeline-desc">{{ s.desc }}</p>
            <ul class="timeline-details">
              <li *ngFor="let d of s.details"><span class="check">&#10003;</span>{{ d }}</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
